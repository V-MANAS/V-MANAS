<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Manas Varade — Building useful things with code</title>
  <desc id="desc">A dark developer command-center banner with cyan and violet terminal-inspired lines, a system prompt, and the name Manas Varade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A13"/>
      <stop offset=".52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7F5"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8FA3C8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="60" r="150" fill="#8B5CF6" opacity=".11" filter="url(#softGlow)"/>
  <circle cx="100" cy="320" r="150" fill="#22D3EE" opacity=".09" filter="url(#softGlow)"/>
  <rect x="38" y="34" width="1124" height="292" rx="18" fill="none" stroke="#667799" stroke-opacity=".32"/>
  <path d="M38 78H1162" stroke="#667799" stroke-opacity=".26"/>
  <circle cx="65" cy="56" r="5" fill="#F87171"/>
  <circle cx="83" cy="56" r="5" fill="#FBBF24"/>
  <circle cx="101" cy="56" r="5" fill="#34D399"/>
  <text x="126" y="61" font-family="monospace" font-size="13" fill="#8493B7">MANAS / DEVELOPER PROFILE</text>
  <text x="78" y="125" font-family="monospace" font-size="15" fill="#67E8F9">$ whoami</text>
  <text x="78" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="60" letter-spacing="2" fill="#F2F5FF">MANAS VARADE</text>
  <rect x="80" y="219" width="440" height="3" rx="2" fill="url(#glow)"/>
  <text x="80" y="258" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C7D2FE">Building useful things with code.</text>
  <text x="80" y="294" font-family="monospace" font-size="14" fill="#8391B1">FULL-STACK DEVELOPMENT  /  BACKEND SYSTEMS  /  AI TOOLS</text>
  <g transform="translate(875 120)">
    <rect x="0" y="0" width="210" height="126" rx="12" fill="#070A13" fill-opacity=".72" stroke="#7C8AAF" stroke-opacity=".35"/>
    <text x="18" y="27" font-family="monospace" font-size="12" fill="#7C8AAF">BUILD STATUS</text>
    <circle cx="20" cy="51" r="4" fill="#34D399"/>
    <text x="34" y="55" font-family="monospace" font-size="13" fill="#D2DBF2">learn()</text>
    <circle cx="20" cy="77" r="4" fill="#67E8F9"/>
    <text x="34" y="81" font-family="monospace" font-size="13" fill="#D2DBF2">build()</text>
    <circle cx="20" cy="103" r="4" fill="#A78BFA"/>
    <text x="34" y="107" font-family="monospace" font-size="13" fill="#D2DBF2">iterate()</text>
  </g>
  <path d="M835 282h265" stroke="url(#glow)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <path d="M1079 276l8 6-8 6" fill="none" stroke="#A78BFA" stroke-width="2"/>
</svg>